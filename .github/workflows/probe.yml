name: Probe source capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch homepage
        shell: bash
        run: |
          set -x
          curl --location --compressed --retry 3 --connect-timeout 20 --max-time 90 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
            -D headers.txt -o source.html -w '%{http_code} %{content_type} %{size_download}\n' \
            'https://www.cbwebsitedesign.co.uk/' | tee status.txt
          wc -c source.html
          head -c 300 source.html | tr '\n' ' '
          grep -o '<title>[^<]*</title>' source.html | head -1 || true
          if grep -qi 'Just a moment' source.html; then echo 'CLOUDFLARE_CHALLENGE' >> status.txt; fi
          if grep -qi 'Website Design London' source.html || grep -qi 'Web Design London' source.html; then echo 'VALID_SITE' >> status.txt; fi
      - name: Commit probe report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt headers.txt
          git commit -m 'Record capture probe' || exit 0
          git push origin HEAD:main
