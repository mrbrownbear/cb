name: Animation runtime audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/anim-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit runtime animations
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .25; done
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']
            });
            const page = await browser.newPage();
            await page.setViewport({width: 1440, height: 1000, deviceScaleFactor: 1});
            const logs = [];
            page.on('console', m => logs.push('CONSOLE ' + m.type() + ': ' + m.text()));
            page.on('pageerror', e => logs.push('PAGEERROR: ' + e.message));
            page.on('requestfailed', r => logs.push('REQUESTFAILED: ' + r.url() + ' :: ' + (r.failure()?.errorText || '')));
            await page.goto('http://127.0.0.1:4173/', {waitUntil: 'networkidle0', timeout: 30000});
            await new Promise(r => setTimeout(r, 6000));
            let report = await page.evaluate(() => ({
              title: document.title,
              hero: !!document.querySelector('.hero'),
              gradient: !!document.querySelector('.hero .gradient'),
              canvasCount: document.querySelectorAll('.hero canvas.hero-bg').length,
              canvas: (() => { const c = document.querySelector('.hero canvas.hero-bg'); return c ? {width:c.width,height:c.height,clientWidth:c.clientWidth,clientHeight:c.clientHeight} : null; })(),
              gsap: typeof window.gsap,
              ScrollTrigger: typeof window.ScrollTrigger,
              Scroller: typeof window.Scroller,
              scripts: [...document.scripts].map(s => s.src).filter(Boolean).filter(s => /cbd|hero|block|bundle/.test(s)),
              animatedInline: [...document.querySelectorAll('[style]')].filter(el => /transform|opacity/.test(el.getAttribute('style')||'')).length,
              readyState: document.readyState
            }));
            console.log('REPORT_BEFORE_MOVE=' + JSON.stringify(report));
            const canvas = await page.$('.hero canvas.hero-bg');
            if (canvas) {
              const box = await canvas.boundingBox();
              if (box) {
                await page.mouse.move(box.x + box.width * .3, box.y + box.height * .35);
                await page.mouse.move(box.x + box.width * .7, box.y + box.height * .65, {steps: 30});
                await new Promise(r => setTimeout(r, 2500));
              }
            }
            await page.evaluate(() => window.scrollTo(0, Math.min(1800, document.body.scrollHeight - innerHeight)));
            await new Promise(r => setTimeout(r, 2000));
            report = await page.evaluate(() => ({
              scrollY: window.scrollY,
              canvasCount: document.querySelectorAll('.hero canvas.hero-bg').length,
              canvas: (() => { const c = document.querySelector('.hero canvas.hero-bg'); return c ? {width:c.width,height:c.height,clientWidth:c.clientWidth,clientHeight:c.clientHeight} : null; })(),
              animatedInline: [...document.querySelectorAll('[style]')].filter(el => /transform|opacity/.test(el.getAttribute('style')||'')).length,
              bodyClass: document.body.className
            }));
            console.log('REPORT_AFTER_MOVE=' + JSON.stringify(report));
            console.log(logs.join('\n'));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
